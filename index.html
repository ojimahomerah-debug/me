<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Our Ai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #eef1f8;
      --surface: #ffffff;
      --ink: #1b2340;
      --muted: #5f6987;
      --line: #d9deec;
      --primary: #4437c9;
      --primary-ink: #ffffff;
      --sun: #f2b632;
      --user: #e3e0fb;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 "Figtree", system-ui, sans-serif;
    }

    button,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100dvh;
    }

    /* Brand */

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }

    .mark {
      width: 34px;
      height: 34px;
    }

    .m1 {
      fill: var(--primary);
    }

    .m2 {
      fill: var(--sun);
      mix-blend-mode: multiply;
      opacity: 0.95;
    }

    .word {
      font: 600 1.35rem "Fraunces", Georgia, serif;
      letter-spacing: -0.01em;
    }

    /* Sidebar */

    .rail {
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      border-right: 1px solid var(--line);
      background: var(--bg);
    }

    .new {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
      text-align: left;
      transition: border-color 0.15s, transform 0.15s;
    }

    .new:hover {
      border-color: var(--primary);
    }

    .new:active {
      transform: scale(0.98);
    }

    .rail-note {
      margin-top: auto;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Main */

    .stage {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
      padding: 0 20px 14px;
    }

    .topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
    }

    .new.small {
      padding: 7px 14px;
    }

    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0 12px;
      scroll-behavior: smooth;
    }

    .thread > * {
      max-width: 720px;
      margin-inline: auto;
    }

    /* Hero */

    .hero {
      padding-top: 9vh;
    }

    .hero h1 {
      font: 500 clamp(2rem, 5vw, 3.2rem) / 1.1 "Fraunces", Georgia, serif;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      max-width: 14ch;
    }

    .hero p {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 1.05rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }

    .chip:hover {
      border-color: var(--primary);
    }

    /* Messages */

    .msg {
      display: flex;
      gap: 14px;
      margin-bottom: 26px;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .msg.user .body {
      background: var(--user);
      border-radius: var(--radius) var(--radius) 4px var(--radius);
      padding: 10px 16px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .msg.ai .avatar {
      flex: none;
      width: 30px;
      height: 30px;
      margin-top: 2px;
    }

    .msg.ai .body {
      min-width: 0;
      flex: 1;
    }

    .body p {
      margin: 0 0 0.8em;
    }

    .body p:last-child {
      margin-bottom: 0;
    }

    .body ul,
    .body ol {
      padding-left: 1.3em;
      margin: 0 0 0.8em;
    }

    .body a {
      color: var(--primary);
    }

    .body pre {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
      font-size: 0.9rem;
    }

    .body code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.92em;
    }

    .body :not(pre) > code {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1px 6px;
    }

    .body table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .body th,
    .body td {
      border: 1px solid var(--line);
      padding: 6px 12px;
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .sources a {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.82rem;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 12px;
      background: var(--surface);
    }

    .sources a:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .error .body {
      color: #b3261e;
    }

    /* Thinking animation */

    .thinking {
      display: inline-block;
      width: 44px;
      height: 30px;
      position: relative;
    }

    .thinking i {
      position: absolute;
      top: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    .thinking i:first-child {
      left: 0;
      background: var(--primary);
      animation: meet 1.2s ease-in-out infinite alternate;
    }

    .thinking i:last-child {
      right: 0;
      background: var(--sun);
      opacity: 0.9;
      animation: meet 1.2s ease-in-out infinite alternate-reverse;
    }

    @keyframes meet {
      to {
        transform: translateX(10px);
      }
    }

    /* Composer */

    .composer {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 8px 8px 8px 20px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .composer:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(68, 55, 201, 0.18);
    }

    .composer textarea {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      resize: none;
      max-height: 180px;
      padding: 8px 0;
      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: var(--muted);
    }

    .send {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      background: var(--primary);
      color: var(--primary-ink);
      display: grid;
      place-items: center;
      transition: transform 0.15s, opacity 0.15s;
    }

    .send svg {
      width: 20px;
      height: 20px;
    }

    .send:hover {
      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .fine {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 10px 0 0;
    }

    /* Mobile */

    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
      }

      .rail {
        display: none;
      }

      .topbar {
        display: flex;
      }

      .stage {
        padding: 0 14px 10px;
      }

      .hero {
        padding-top: 3vh;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- Sidebar -->

    <aside class="rail">

      <a class="brand" href="/" aria-label="Our Ai home">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="15" cy="20" r="11" class="m1"></circle>
          <circle cx="25" cy="20" r="11" class="m2"></circle>
        </svg>

        <span class="word">Our Ai</span>
      </a>

      <button class="new" id="newChat" type="button">
        New chat
      </button>

      <p class="rail-note">
        Answers can draw on live web search.
        Sources appear under each reply.
      </p>

    </aside>


    <!-- Main -->

    <main class="stage">

      <header class="topbar">

        <a class="brand" href="/">
          <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="15" cy="20" r="11" class="m1"></circle>
            <circle cx="25" cy="20" r="11" class="m2"></circle>
          </svg>

          <span class="word">Our Ai</span>
        </a>

        <button class="new small" id="newChatTop" type="button">
          New chat
        </button>

      </header>


      <!-- Conversation -->

      <section class="thread" id="thread" aria-live="polite">

        <div class="hero" id="hero">

          <h1>
            What shall we look into together?
          </h1>

          <p>
            Ask a question, draft something, or check a fact.
          </p>

          <div class="chips">

            <button type="button" class="chip">
              Explain how vaccines train the immune system
            </button>

            <button type="button" class="chip">
              What is in the news today?
            </button>

            <button type="button" class="chip">
              Help me write a kind reply to an email
            </button>

            <button type="button" class="chip">
              Plan a simple weekly meal budget
            </button>

          </div>

        </div>

      </section>


      <!-- Message box -->

      <form class="composer" id="composer" autocomplete="off">

        <textarea
          id="input"
          rows="1"
          placeholder="Message Our Ai"
          aria-label="Message Our Ai"
        ></textarea>

        <button
          class="send"
          id="send"
          type="submit"
          aria-label="Send message"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 19V5M5 12l7-7 7 7"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </svg>
        </button>

      </form>

      <p class="fine">
        Our Ai can make mistakes. Check important information.
      </p>

    </main>

  </div>


  <!-- Markdown -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

  <!-- Security -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>


  <script>
    const thread = document.getElementById("thread");
    const hero = document.getElementById("hero");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const MARK = `
      <svg class="avatar" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="15" cy="20" r="11" class="m1"></circle>
        <circle cx="25" cy="20" r="11" class="m2"></circle>
      </svg>
    `;

    let messages = [];
    let busy = false;


    function md(text) {
      return DOMPurify.sanitize(
        marked.parse(text, { breaks: true }),
        { ADD_ATTR: ["target"] }
      );
    }


    function addMessage(role, html, extraClass = "") {

      const el = document.createElement("div");

      el.className = `msg ${role} ${extraClass}`.trim();

      if (role === "ai") {
        el.innerHTML = `
          ${MARK}
          <div class="body">${html}</div>
        `;
      } else {
        el.innerHTML = `
          <div class="body"></div>
        `;
      }

      thread.appendChild(el);

      thread.scrollTop = thread.scrollHeight;

      return el;
    }


    function addSources(el, sources) {

      if (!sources || !sources.length) {
        return;
      }

      const wrap = document.createElement("div");

      wrap.className = "sources";

      sources.forEach((s) => {

        const a = document.createElement("a");

        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = s.title;
        a.textContent = s.title;

        wrap.appendChild(a);

      });

      el.querySelector(".body").appendChild(wrap);
    }


    async function send(text) {

      text = text.trim();

      if (!text || busy) {
        return;
      }

      busy = true;
      sendBtn.disabled = true;

      if (hero) {
        hero.remove();
      }

      messages.push({
        role: "user",
        content: text
      });

      const userMessage = addMessage("user", "");

      userMessage.querySelector(".body").textContent = text;

      input.value = "";

      resize();


      const pending = addMessage(
        "ai",
        `
          <span
            class="thinking"
            role="status"
            aria-label="Our Ai is thinking"
          >
            <i></i>
            <i></i>
          </span>
        `
      );


      try {

        const res = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            messages: messages
          })

        });


        const data = await res.json();


        if (!res.ok) {
          throw new Error(
            data.detail || "Something went wrong."
          );
        }


        messages.push({
          role: "assistant",
          content: data.reply
        });


        pending.querySelector(".body").innerHTML =
          md(data.reply);


        pending
          .querySelectorAll(".body a")
          .forEach((a) => {

            a.target = "_blank";
            a.rel = "noopener noreferrer";

          });


        addSources(
          pending,
          data.sources
        );


      } catch (err) {

        messages.pop();

        pending.classList.add("error");

        pending.querySelector(".body").textContent =
          `${err.message} Edit your message and send it again.`;

        input.value = text;

        resize();

      } finally {

        busy = false;

        sendBtn.disabled = false;

        thread.scrollTop = thread.scrollHeight;

        input.focus();

      }

    }


    function resize() {

      input.style.height = "auto";

      input.style.height =
        Math.min(input.scrollHeight, 180) + "px";

    }


    form.addEventListener("submit", (e) => {

      e.preventDefault();

      send(input.value);

    });


    input.addEventListener("input", resize);


    input.addEventListener("keydown", (e) => {

      if (
        e.key === "Enter" &&
        !e.shiftKey &&
        !e.isComposing
      ) {

        e.preventDefault();

        send(input.value);

      }

    });


    document
      .querySelectorAll(".chip")
      .forEach((chip) => {

        chip.addEventListener(
          "click",
          () => send(chip.textContent)
        );

      });


    ["newChat", "newChatTop"].forEach((id) => {

      const button = document.getElementById(id);

      if (button) {

        button.addEventListener(
          "click",
          () => location.reload()
        );

      }

    });


    input.focus();
  </script>

</body>
</html>
